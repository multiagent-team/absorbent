[project]
name = "absorbent"
version = "0.1.0"
description = "Лекционное видео -> структурированный конспект в Markdown."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0",
    "openai-whisper",
    "torch",
    "pyyaml",
    "imagehash",
    "Pillow",
    "numpy",
    # httpx не умеет SOCKS-прокси без этого пакета, а окружение пользователя
    # ходит в API через ALL_PROXY=socks5://127.0.0.1:1080.
    "socksio",
    "websockets>=17.1",
]

[project.scripts]
absorbent = "absorbent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/absorbent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/absorbent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
